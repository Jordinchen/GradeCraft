[package]
name = "gradecraft"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland", "links"] }
egui-phosphor = "0.14"
gradecraft-core = { version = "0.2.0", path = "../gradecraft-core" }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
egui_kittest = "0.36.2"

[build-dependencies]
winresource = "0.1.34"
