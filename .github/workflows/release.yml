name: Release

# Ein Release entsteht durch Pushen eines Tags (git tag v0.1.0 && git push origin v0.1.0)
# oder durch manuellen Start unter Actions → Release → „Run workflow“ (Tag wird erzeugt).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { throw "Tag v$tag passt nicht zur Version $v in Cargo.toml" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: cargo test --workspace --release

      - name: Release-Build
        run: cargo build --release -p gradecraft

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceExe=..\target\release\gradecraft.exe" installer\gradecraft.iss
          Copy-Item target\release\gradecraft.exe "dist\GradeCraft-${{ steps.version.outputs.version }}-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: GradeCraft-Windows
          path: dist/*

      # Bei Tag-Push oder manuellem Start („Run workflow“): Release anlegen.
      # Beim manuellen Start wird das Tag v<Version> automatisch erzeugt.
      - name: GitHub-Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GradeCraft ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
